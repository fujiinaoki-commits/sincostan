  document.getElementById('pr-rtxt').innerHTML  = correctHTML || '';
  document.getElementById('pr-next').textContent = '次の問題 →';
  pracHintShown = true; // show answer on canvas
  pracDrawCanvas();
}

// ── Canvas helpers ────────────────────────────
function pracInitCanvas() {
  const cv = document.getElementById('prac-canvas');
  const dpr = window.devicePixelRatio || 1;
  cv.width  = 330 * dpr;
  cv.height = 330 * dpr;
  cv.style.width  = '330px';
  cv.style.height = '330px';
}

function prCanvasCoords(clientX, clientY) {
  const cv = document.getElementById('prac-canvas');
  const rect = cv.getBoundingClientRect();
  const dpr  = window.devicePixelRatio || 1;
  return [(clientX - rect.left) * dpr, (clientY - rect.top) * dpr];
}

function prNearestCandidate(mx, my) {
  const cv  = document.getElementById('prac-canvas');
  const dpr = window.devicePixelRatio || 1;
  const cx  = cv.width/2, cy = cv.height/2, r = PR_R * dpr;
  let best = null, bestD = 24 * dpr;
  PR_CANDS.forEach(d => {
    const rad = d * Math.PI / 180;
    const px = cx + r * Math.cos(-rad);
    const py = cy + r * Math.sin(-rad);
    const dist = Math.hypot(mx - px, my - py);
    if (dist < bestD) { bestD = dist; best = d; }
  });
  return best;
}

function pracDrawCanvas() {
  const cv  = document.getElementById('prac-canvas');
  const ctx = cv.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const W = cv.width, H = cv.height;
  const cx = W/2, cy = H/2, r = PR_R * dpr;

  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#F5F7FF';
  ctx.beginPath(); ctx.roundRect(0,0,W,H,10*dpr); ctx.fill();

  // Axes
  ctx.strokeStyle='#C7D2FE'; ctx.lineWidth=1.5*dpr;
  ctx.beginPath(); ctx.moveTo(14*dpr,cy); ctx.lineTo(W-14*dpr,cy); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx,14*dpr); ctx.lineTo(cx,H-14*dpr); ctx.stroke();

  // Circle
  ctx.strokeStyle='#C7D2FE'; ctx.lineWidth=1.8*dpr;
  ctx.beginPath(); ctx.arc(cx,cy,r,0,2*Math.PI); ctx.stroke();

  // Hint line (only when hint shown)
  if (pracHintShown && (pracMode==='eq' || pracMode==='ineq')) drawHintLine(ctx,cx,cy,r,dpr);

  // Mode-specific points
  if      (pracMode==='eq')   drawEqPoints  (ctx,cx,cy,r,dpr);
  else if (pracMode==='ineq') drawIneqPoints(ctx,cx,cy,r,dpr);
  else                        drawSimpleCircle(ctx,cx,cy,r,dpr);

  // Axis labels
  ctx.fillStyle='#9CA3AF'; ctx.font=`${10*dpr}px sans-serif`;
  ctx.textAlign='left';    ctx.textBaseline='alphabetic';
  ctx.fillText('1',  cx+r+4*dpr,  cy-3*dpr);
  ctx.fillText('-1', cx-r-22*dpr, cy-3*dpr);
  ctx.textAlign='center';
  ctx.fillText('1',  cx,  12*dpr);
  ctx.fillText('-1', cx,  H-3*dpr);
  ctx.fillText('O',  cx-9*dpr, cy+14*dpr);
  ctx.fillStyle='#6B7280';
  ctx.beginPath(); ctx.arc(cx,cy,3*dpr,0,2*Math.PI); ctx.fill();
}

function drawHintLine(ctx, cx, cy, r, dpr) {
  const q = pracQ;
  const val = q.val;
  ctx.save();
  ctx.setLineDash([6*dpr, 4*dpr]);
  ctx.lineWidth = 2*dpr;
  if (q.fn === 'sin') {
    const ly = cy - val * r;
    ctx.strokeStyle = '#4361EE80';
    ctx.beginPath(); ctx.moveTo(14*dpr, ly); ctx.lineTo(cx*2-14*dpr, ly); ctx.stroke();
  } else if (q.fn === 'cos') {
    const lx = cx + val * r;
    ctx.strokeStyle = '#7209B780';
    ctx.beginPath(); ctx.moveTo(lx, 14*dpr); ctx.lineTo(lx, cy*2-14*dpr); ctx.stroke();
  } else {
    ctx.strokeStyle = '#EF233C80';
    ctx.beginPath(); ctx.moveTo(cx - r, cy + val*r); ctx.lineTo(cx + r, cy - val*r); ctx.stroke();
  }
  ctx.setLineDash([]);
  ctx.restore();
}

function drawSimpleCircle(ctx, cx, cy, r, dpr) {
  PR_CANDS.forEach(d => {
    const rad = d * Math.PI / 180;
    const px = cx + r * Math.cos(-rad), py = cy + r * Math.sin(-rad);
    ctx.fillStyle = '#E0E7FF';
    ctx.beginPath(); ctx.arc(px, py, 8*dpr, 0, 2*Math.PI); ctx.fill();
  });
}

// ── ① EQUATION ───────────────────────────────
function setupEq() {
  katex.render(`\\${pracQ.fn}\\,\\theta = ${pracQ.valTex}\\quad(0°\\leqq\\theta<360°)`,
    document.getElementById('pr-question'), {throwOnError:false});
  document.getElementById('pr-hint').textContent =
    `交点をすべてタップしてください（${pracQ.ans.length}個）`;
  document.getElementById('pr-hint-btn').style.display = 'inline-block';
  document.getElementById('pr-hint-btn').textContent = '💡 ヒントを見る';
  document.getElementById('pr-hint-btn').style.opacity = '1';
  pracInitCanvas(); pracDrawCanvas();
  const cv = document.getElementById('prac-canvas');
  cv.onclick = eqHandleClick;
  cv.onmousedown = null; cv.onmousemove = null; cv.onmouseup = null;
  cv.ontouchstart = null; cv.ontouchmove = null; cv.ontouchend = null;
}

function drawEqPoints(ctx, cx, cy, r, dpr) {
  PR_CANDS.forEach(d => {
    const rad = d * Math.PI / 180;
    const px = cx + r * Math.cos(-rad), py = cy + r * Math.sin(-rad);
    const isSel = eqSelected.includes(d);
    const isAns = pracQ.ans.includes(d);
    let fill = '#E0E7FF';
    if (pracAnswered && isAns)  fill = '#06D6A0';
    else if (isSel)             fill = '#4361EE';
    ctx.fillStyle = fill;
    ctx.beginPath(); ctx.arc(px, py, 10*dpr, 0, 2*Math.PI); ctx.fill();
    if (isSel || (pracAnswered && isAns)) {
      ctx.strokeStyle='white'; ctx.lineWidth=2*dpr;
      ctx.beginPath(); ctx.arc(px, py, 10*dpr, 0, 2*Math.PI); ctx.stroke();
    }
    ctx.fillStyle = (isSel || (pracAnswered && isAns)) ? 'white' : '#9CA3AF';
    ctx.font = `${7.5*dpr}px sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(d + '°', px, py);
  });
}

function eqHandleClick(e) {
  if (pracAnswered) return;
  const [mx, my] = prCanvasCoords(e.clientX, e.clientY);
  const best = prNearestCandidate(mx, my);
  if (best === null) return;
  const idx = eqSelected.indexOf(best);
  if (idx >= 0) eqSelected.splice(idx, 1);
  else eqSelected.push(best);
  pracDrawCanvas();
  if (eqSelected.length === pracQ.ans.length) {
    const ok = JSON.stringify([...eqSelected].sort((a,b)=>a-b)) ===
               JSON.stringify([...pracQ.ans].sort((a,b)=>a-b));
    pracShowResult(ok, `正解: θ = ${pracQ.ans.join('°, ')}°`);
  }
}

// ── ② INEQUALITY ─────────────────────────────
function setupIneq() {
  katex.render(`\\${pracQ.fn}\\,\\theta ${pracQ.opTex} ${pracQ.valTex}\\quad(0°\\leqq\\theta<360°)`,
    document.getElementById('pr-question'), {throwOnError:false});
  document.getElementById('pr-hint').textContent =
    '条件を満たす点をタップ・またはドラッグして塗り、「決定」を押してください';
  document.getElementById('pr-hint-btn').style.display = 'inline-block';
  document.getElementById('pr-hint-btn').textContent = '💡 ヒントを見る';
  document.getElementById('pr-hint-btn').style.opacity = '1';
  ineqSelected = new Set();

  // Confirm button
  document.getElementById('pr-substep').style.display = 'block';
  document.getElementById('pr-substep-content').innerHTML =
    '<button onclick="ineqConfirm()" style="width:100%;background:var(--success);color:white;border:none;border-radius:10px;padding:11px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit">✔ この範囲で決定</button>';

  pracInitCanvas(); pracDrawCanvas();

  const cv = document.getElementById('prac-canvas');
  cv.onclick = null;

  // Tap
  cv.onclick = ineqHandleTap;

  // Drag (mouse)
  cv.onmousedown = (e) => {
    ineqDragging = true; ineqLastPainted = null;
    const [mx,my] = prCanvasCoords(e.clientX, e.clientY);
    const d = prNearestCandidate(mx, my);
    if (d !== null) { ineqTogglePaint(d); ineqLastPainted = d; }
  };
  cv.onmousemove = (e) => {
    if (!ineqDragging || pracAnswered) return;
    const [mx,my] = prCanvasCoords(e.clientX, e.clientY);
    const d = prNearestCandidate(mx, my);
    if (d !== null && d !== ineqLastPainted) { ineqPaintOn(d); ineqLastPainted = d; }
  };
  cv.onmouseup = () => { ineqDragging = false; };

  // Drag (touch)
  cv.ontouchstart = (e) => {
    e.preventDefault(); ineqDragging = true; ineqLastPainted = null;
    const t = e.touches[0];
    const [mx,my] = prCanvasCoords(t.clientX, t.clientY);
    const d = prNearestCandidate(mx, my);
    if (d !== null) { ineqTogglePaint(d); ineqLastPainted = d; }
  };
  cv.ontouchmove = (e) => {
    e.preventDefault();
    if (!ineqDragging || pracAnswered) return;
    const t = e.touches[0];
    const [mx,my] = prCanvasCoords(t.clientX, t.clientY);
    const d = prNearestCandidate(mx, my);
    if (d !== null && d !== ineqLastPainted) { ineqPaintOn(d); ineqLastPainted = d; }
  };
  cv.ontouchend = (e) => { e.preventDefault(); ineqDragging = false; };
}

function ineqHandleTap(e) {
  if (pracAnswered || ineqDragging) return;
  const [mx,my] = prCanvasCoords(e.clientX, e.clientY);
  const d = prNearestCandidate(mx, my);
  if (d !== null) ineqTogglePaint(d);
}

function ineqTogglePaint(d) {
  if (ineqSelected.has(d)) ineqSelected.delete(d);
  else ineqSelected.add(d);
  pracDrawCanvas();
}

function ineqPaintOn(d) {
  ineqSelected.add(d);
  pracDrawCanvas();
}

function ineqConfirm() {
  if (pracAnswered) return;
  const ansSet = new Set(pracQ.ans);
  const ok = [...ineqSelected].every(d => ansSet.has(d)) &&
             pracQ.ans.every(d => ineqSelected.has(d));
  pracShowResult(ok, `正解の点: ${pracQ.ans.join('°, ')}°`);
}

function drawIneqPoints(ctx, cx, cy, r, dpr) {
  PR_CANDS.forEach(d => {
    const rad = d * Math.PI / 180;
    const px = cx + r * Math.cos(-rad), py = cy + r * Math.sin(-rad);
    const isPainted = ineqSelected.has(d);
    const isAns = pracQ.ans.includes(d);
    let fill = '#E0E7FF';
    if (pracAnswered && isAns)   fill = '#06D6A0';
    else if (pracAnswered && isPainted && !isAns) fill = '#EF233C';
    else if (isPainted)          fill = '#4361EE';
    ctx.fillStyle = fill;
    ctx.beginPath(); ctx.arc(px, py, 10*dpr, 0, 2*Math.PI); ctx.fill();
    if (isPainted || (pracAnswered && isAns)) {
      ctx.strokeStyle = 'white'; ctx.lineWidth = 2*dpr;
      ctx.beginPath(); ctx.arc(px, py, 10*dpr, 0, 2*Math.PI); ctx.stroke();
    }
    ctx.fillStyle = (isPainted || (pracAnswered && isAns)) ? 'white' : '#9CA3AF';
    ctx.font = `${7.5*dpr}px sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(d + '°', px, py);
  });
}

// ── ④ SYNTHESIS ──────────────────────────────
function setupComp() {
  const q = pracQ;
  katex.render(`${q.a}\\sin\\theta + ${q.b}\\cos\\theta = R\\sin(\\theta+\\varphi)`,
    document.getElementById('pr-question'), {throwOnError:false});
  document.getElementById('pr-hint').textContent = 'まず R を選び、次に φ を単位円でタップしてください';
  document.getElementById('pr-hint-btn').style.display = 'none';

  const allR = ['\\sqrt{2}','2','\\sqrt{3}','\\sqrt{5}','2\\sqrt{2}','1'];
  const rChoices = [q.Rtex, ...allR.filter(v=>v!==q.Rtex)].slice(0,4);
  rChoices.sort(()=>Math.random()-0.5);
  let html = `<div style="font-size:12px;color:var(--muted);margin-bottom:8px">R を選択：</div>
    <div style="display:flex;flex-wrap:wrap;gap:8px">`;
  rChoices.forEach(tex => {
    html += `<button onclick="compSelectR('${tex}','${q.Rtex}')"
      style="padding:8px 18px;border-radius:10px;border:2px solid var(--border);background:white;font-family:inherit;cursor:pointer;font-size:14px">
      ${katex.renderToString(tex,{throwOnError:false})}</button>`;
  });
  html += `</div><div id="comp-phi-prompt" style="font-size:12px;color:var(--muted);margin-top:8px;display:none">
    φ を単位円でタップしてください</div>`;
  document.getElementById('pr-substep').style.display='block';
  document.getElementById('pr-substep-content').innerHTML=html;
  compRCorrect=false;
  pracInitCanvas(); pracDrawCanvas();
  const cv=document.getElementById('prac-canvas');
  cv.onclick=compHandleClick;
  cv.onmousedown=null; cv.onmousemove=null; cv.onmouseup=null;
  cv.ontouchstart=null; cv.ontouchmove=null; cv.ontouchend=null;
}

function compSelectR(chosen, correct) {
  if (pracAnswered) return;
  if (chosen !== correct) { pracShowResult(false, `R の正解: \\(${correct}\\)`); return; }
  compRCorrect = true;
  document.getElementById('comp-phi-prompt').style.display='block';
}

function compHandleClick(e) {
  if (pracAnswered || !compRCorrect) return;
  const [mx,my] = prCanvasCoords(e.clientX, e.clientY);
  const best = prNearestCandidate(mx, my);
  if (best===null) return;
  const norm = ((pracQ.phi % 360)+360)%360;
  pracShowResult(best===norm, `R = ${pracQ.Rtex},  φ = ${pracQ.phiTex}`);
}

// ── ⑤ ADDITION ───────────────────────────────
function setupAdd() {
  const q = pracQ;
  katex.render(`${q.tex} = ${q.expand} = \\;?`,
    document.getElementById('pr-question'), {throwOnError:false});
  document.getElementById('pr-hint').textContent='展開して計算し、値を選んでください';
  document.getElementById('pr-hint-btn').style.display='none';
  let html=`<div style="display:flex;flex-direction:column;gap:8px">`;
  [...q.choices].sort(()=>Math.random()-0.5).forEach(tex=>{
    html+=`<button onclick="addSelect('${tex}','${q.ans}')"
      style="padding:10px 16px;border-radius:10px;border:2px solid var(--border);background:white;font-family:inherit;cursor:pointer;font-size:15px;text-align:left">
      ${katex.renderToString(tex,{throwOnError:false})}</button>`;
  });
  html+=`</div>`;
  document.getElementById('pr-substep').style.display='block';
  document.getElementById('pr-substep-content').innerHTML=html;
  pracInitCanvas(); pracDrawCanvas();
  const cv=document.getElementById('prac-canvas');
  cv.onclick=null; cv.onmousedown=null; cv.onmousemove=null; cv.onmouseup=null;
  cv.ontouchstart=null; cv.ontouchmove=null; cv.ontouchend=null;
}

function addSelect(chosen, correct) {
  if (pracAnswered) return;
  pracShowResult(chosen===correct, `正解: \\(${correct}\\)`);
}

// ── Init ─────────────────────────────────────
function initPractice() {
  pracInitCanvas();
  pracNewQuestion();
}

/* ══════════════════════════════════════════════
   PROP (三角関数の性質)
══════════════════════════════════════════════ */

const PROP_R = 118;
let propType = 'neg';
let propTheta = 45; // degrees

// ── Property definitions ─────────────────────
const PROP_TYPES = {
  neg: {
    title: '−θ の変換（x軸対称）',
    transform: deg => -deg,
    labelTex: '-\\theta',
    color: '#EF233C',
    rules: [
      {tex: '\\sin(-\\theta) = -\\sin\\theta', note: 'y座標が反転'},
      {tex: '\\cos(-\\theta) = \\cos\\theta',  note: 'x座標は変わらない'},
      {tex: '\\tan(-\\theta) = -\\tan\\theta', note: '傾きが反転'},
    ],
    explain: 'θ と −θ は x軸に関して対称。y座標が逆になるのでsinは符号が変わり、x座標は同じなのでcosは変わらない。',
  },
  pluspi: {
    title: 'θ+π の変換（原点対称）',
    transform: deg => deg + 180,
    labelTex: '\\theta+\\pi',
    color: '#7209B7',
    rules: [
      {tex: '\\sin(\\theta+\\pi) = -\\sin\\theta', note: 'y座標が反転'},
      {tex: '\\cos(\\theta+\\pi) = -\\cos\\theta', note: 'x座標が反転'},
      {tex: '\\tan(\\theta+\\pi) = \\tan\\theta',  note: '傾きは同じ'},
    ],
    explain: 'θ+π は原点対称の位置。x座標もy座標も両方符号が反転するが、傾き（tan）は変わらない。',
  },
  minuspi: {
    title: 'π−θ の変換（y軸対称）',
    transform: deg => 180 - deg,
    labelTex: '\\pi-\\theta',
    color: '#06D6A0',
    rules: [
      {tex: '\\sin(\\pi-\\theta) = \\sin\\theta',  note: 'y座標は同じ'},
      {tex: '\\cos(\\pi-\\theta) = -\\cos\\theta', note: 'x座標が反転'},
      {tex: '\\tan(\\pi-\\theta) = -\\tan\\theta', note: '傾きが反転'},
    ],
    explain: 'π−θ は y軸に関して対称の位置。y座標は同じなのでsinは変わらず、x座標が逆になるのでcosは符号反転。',
  },
  pluspi2: {
    title: 'θ+π/2 の変換（90°回転）',
    transform: deg => deg + 90,
    labelTex: '\\theta+\\dfrac{\\pi}{2}',
    color: '#F77F00',
    rules: [
      {tex: '\\sin\\!\\left(\\theta+\\dfrac{\\pi}{2}\\right) = \\cos\\theta',  note: 'y座標 = 元のx座標'},
      {tex: '\\cos\\!\\left(\\theta+\\dfrac{\\pi}{2}\\right) = -\\sin\\theta', note: 'x座標 = 元のy座標の反転'},
      {tex: '\\tan\\!\\left(\\theta+\\dfrac{\\pi}{2}\\right) = -\\dfrac{1}{\\tan\\theta}', note: '傾きが逆数の符号反転'},
    ],
    explain: '90°回転すると、sinとcosが入れ替わる。直角三角形の合同から導ける。',
  },
  minuspi2: {
    title: 'π/2−θ の変換（余角）',
    transform: deg => 90 - deg,
    labelTex: '\\dfrac{\\pi}{2}-\\theta',
    color: '#3A86FF',
    rules: [
      {tex: '\\sin\\!\\left(\\dfrac{\\pi}{2}-\\theta\\right) = \\cos\\theta', note: '余角の関係'},
      {tex: '\\cos\\!\\left(\\dfrac{\\pi}{2}-\\theta\\right) = \\sin\\theta', note: '余角の関係'},
      {tex: '\\tan\\!\\left(\\dfrac{\\pi}{2}-\\theta\\right) = \\dfrac{1}{\\tan\\theta}', note: '逆数'},
    ],
    explain: '直角三角形で一方の角がθなら他方はπ/2−θ。sinとcosが入れ替わる（余角の関係）。',
  },
  period: {
    title: 'θ+2nπ の変換（周期性）',
    transform: deg => deg,
    labelTex: '\\theta+2n\\pi',
    color: '#4361EE',
    rules: [
      {tex: '\\sin(\\theta+2n\\pi) = \\sin\\theta', note: '1周して同じ位置'},
      {tex: '\\cos(\\theta+2n\\pi) = \\cos\\theta', note: '1周して同じ位置'},
      {tex: '\\tan(\\theta+2n\\pi) = \\tan\\theta', note: '1周して同じ位置'},
    ],
    explain: '2π（360°）回転すると完全に1周して元の位置に戻る。sinもcosもtanも値は変わらない。',
  },
};

// ── Setup ─────────────────────────────────────
function propSet(btn, type) {
  document.querySelectorAll('.prop-type-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  propType = type;
  propUpdateRules();
  propDraw();
}

function propSlider(val) {
  propTheta = parseInt(val);
  document.getElementById('prop-deg-label').textContent = propTheta + '°';
  propDraw();
}

function propUpdateRules() {
  const pt = PROP_TYPES[propType];
  document.getElementById('prop-rule-title').textContent = pt.title;
  const cont = document.getElementById('prop-rules');
  cont.innerHTML = '';
  pt.rules.forEach(r => {
    const row = document.createElement('div');
    row.style.cssText = 'display:flex;align-items:center;gap:10px;background:#F5F7FF;border-radius:8px;padding:8px 12px';
    const tex = document.createElement('div');
    tex.style.flex = '1';
    katex.render(r.tex, tex, {throwOnError:false, displayMode:false});
    const note = document.createElement('div');
    note.style.cssText = 'font-size:10px;color:var(--muted);text-align:right;min-width:80px';
    note.textContent = r.note;
    row.appendChild(tex); row.appendChild(note);
    cont.appendChild(row);
  });
  // Explain text shown below
}

function propInitCanvas() {
  const cv = document.getElementById('prop-canvas');
  const dpr = window.devicePixelRatio || 1;
  cv.width  = 330 * dpr;
  cv.height = 330 * dpr;
  cv.style.width  = '330px';
  cv.style.height = '330px';
  propUpdateRules();
}

// ── Drawing ───────────────────────────────────
function propDraw() {
  const cv = document.getElementById('prop-canvas');
  if (!cv) return;
  const ctx = cv.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const W = cv.width, H = cv.height;
  const cx = W/2, cy = H/2, r = PROP_R * dpr;

  const pt  = PROP_TYPES[propType];
  const th  = propTheta;
  const th2 = ((pt.transform(th) % 360) + 360) % 360;

  const rad1 = th  * Math.PI / 180;
  const rad2 = th2 * Math.PI / 180;

  const px1 = cx + r * Math.cos(-rad1), py1 = cy + r * Math.sin(-rad1);
  const px2 = cx + r * Math.cos(-rad2), py2 = cy + r * Math.sin(-rad2);

  // Clear
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#F5F7FF';
  ctx.beginPath(); ctx.roundRect(0,0,W,H,10*dpr); ctx.fill();

  // Axes
  ctx.strokeStyle = '#C7D2FE'; ctx.lineWidth = 1.5*dpr;
  ctx.beginPath(); ctx.moveTo(14*dpr,cy); ctx.lineTo(W-14*dpr,cy); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx,14*dpr); ctx.lineTo(cx,H-14*dpr); ctx.stroke();

  // Symmetry guide lines (dashed, subtle)
  ctx.save(); ctx.setLineDash([5*dpr,5*dpr]); ctx.globalAlpha=0.2; ctx.lineWidth=1.5*dpr;
  if (propType==='neg')     { ctx.strokeStyle='#888'; ctx.beginPath();ctx.moveTo(14*dpr,cy);ctx.lineTo(W-14*dpr,cy);ctx.stroke(); }
  if (propType==='pluspi')  { ctx.strokeStyle='#888'; ctx.beginPath();ctx.arc(cx,cy,r/3,0,2*Math.PI);ctx.stroke(); }
  if (propType==='minuspi') { ctx.strokeStyle='#888'; ctx.beginPath();ctx.moveTo(cx,14*dpr);ctx.lineTo(cx,H-14*dpr);ctx.stroke(); }
  if (propType==='pluspi2'||propType==='minuspi2') {
    ctx.strokeStyle='#888';
    ctx.beginPath();ctx.moveTo(cx-r*0.8,cy+r*0.8);ctx.lineTo(cx+r*0.8,cy-r*0.8);ctx.stroke();
  }
  ctx.restore();

  // Unit circle
  ctx.strokeStyle = '#C7D2FE'; ctx.lineWidth = 1.8*dpr;
  ctx.beginPath(); ctx.arc(cx,cy,r,0,2*Math.PI); ctx.stroke();

  // Arc for theta (blue)
  ctx.strokeStyle = '#4361EE'; ctx.lineWidth = 2.5*dpr; ctx.globalAlpha=0.5;
  ctx.beginPath(); ctx.arc(cx,cy,r*0.25,0,-rad1,false);
  ctx.stroke(); ctx.globalAlpha=1;

  // Arc for transformed (colored)
  ctx.strokeStyle = pt.color; ctx.lineWidth = 2.5*dpr; ctx.globalAlpha=0.4;
  ctx.beginPath(); ctx.arc(cx,cy,r*0.35,0,-rad2,rad2>Math.PI);
  ctx.stroke(); ctx.globalAlpha=1;

  // Projection lines
  const drawProjections = (px, py, color, alpha=0.4) => {
    ctx.save(); ctx.setLineDash([4*dpr,3*dpr]); ctx.lineWidth=1.8*dpr;
    ctx.strokeStyle=color; ctx.globalAlpha=alpha;
    // vertical (sin)
    ctx.beginPath(); ctx.moveTo(px,py); ctx.lineTo(px,cy); ctx.stroke();
    // horizontal (cos)
    ctx.beginPath(); ctx.moveTo(px,py); ctx.lineTo(cx,py); ctx.stroke();
    ctx.restore();
  };
  drawProjections(px1,py1,'#4361EE',0.5);
  drawProjections(px2,py2,pt.color,0.5);

  // Radius lines
  ctx.lineWidth = 2.2*dpr;
  ctx.strokeStyle = '#4361EE';
  ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(px1,py1); ctx.stroke();
  ctx.strokeStyle = pt.color;
  ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(px2,py2); ctx.stroke();

  // Points
  const drawPoint = (px, py, color, label) => {
    ctx.shadowColor=color; ctx.shadowBlur=8*dpr;
    ctx.fillStyle=color;
    ctx.beginPath(); ctx.arc(px,py,12*dpr,0,2*Math.PI); ctx.fill();
    ctx.shadowBlur=0;
    ctx.strokeStyle='white'; ctx.lineWidth=2.5*dpr;
    ctx.beginPath(); ctx.arc(px,py,12*dpr,0,2*Math.PI); ctx.stroke();
    ctx.fillStyle='white'; ctx.font=`bold ${9*dpr}px sans-serif`;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(label,px,py);
  };
  drawPoint(px1,py1,'#4361EE','θ');
  drawPoint(px2,py2,pt.color,propType==='period'?'θ':'θ\'');

  // Center
  ctx.fillStyle='#6B7280';
  ctx.beginPath(); ctx.arc(cx,cy,3.5*dpr,0,2*Math.PI); ctx.fill();

  // Axis labels
  ctx.fillStyle='#9CA3AF'; ctx.font=`${10*dpr}px sans-serif`; ctx.textBaseline='alphabetic';
  ctx.textAlign='left';   ctx.fillText('1',  cx+r+5*dpr, cy-3*dpr);
  ctx.textAlign='right';  ctx.fillText('-1', cx-r-3*dpr, cy-3*dpr);
  ctx.textAlign='center'; ctx.fillText('1',  cx, 11*dpr);
  ctx.textAlign='center'; ctx.fillText('-1', cx, H-2*dpr);

  // ── Update value panels ──
  const sin1=Math.sin(rad1), cos1=Math.cos(rad1), tan1=Math.tan(rad1);
  const sin2=Math.sin(rad2), cos2=Math.cos(rad2), tan2=Math.tan(rad2);
  const norm1=((th%360)+360)%360, norm2=((th2%360)+360)%360;
  const fam1=FAMOUS[norm1], fam2=FAMOUS[norm2];

  document.getElementById('prop-orig-deg').textContent = th + '°';
  document.getElementById('prop-trans-deg').textContent = th2 + '°';

  const labelEl = document.getElementById('prop-trans-label');
  labelEl.innerHTML = `変換後 <span id="prop-trans-deg" style="color:${pt.color};font-weight:700">${th2}°</span>`;

  const renderVals = (elId, sin, cos, tan, fam) => {
    const el = document.getElementById(elId);
    el.innerHTML = '';
    [['sin', sin, fam?.sin], ['cos', cos, fam?.cos], ['tan', tan, fam?.tan]].forEach(([fn,v,ft])=>{
      const row = document.createElement('div');
      row.style.cssText='display:flex;align-items:center;gap:6px;font-size:12px';
      const lbl = document.createElement('span');
      lbl.style.cssText='color:var(--muted);min-width:28px';
      lbl.textContent=fn+' =';
      const val = document.createElement('span');
      val.style.fontWeight='600';
      if(ft){ katex.render(ft,val,{throwOnError:false}); }
      else{ val.textContent=Math.abs(v)>100?'∞':v.toFixed(4); }
      row.appendChild(lbl); row.appendChild(val);
      el.appendChild(row);
    });
  };
  renderVals('prop-orig-vals', sin1, cos1, tan1, fam1);
  renderVals('prop-trans-vals', sin2, cos2, tan2, fam2);
}

function initProp() {
  propInitCanvas();
  propDraw();
  // Slider drag on mobile
  document.getElementById('prop-slider').addEventListener('input', function(){ propSlider(this.value); });
}
